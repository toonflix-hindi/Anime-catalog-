    <!-- ✅ FIXED CSS PATHS -->

    <!-- Font Awesome -->

            </div>
        </div>

    <section class="anime-details-section">
        <div class="container">
            <div class="anime-details-wrapper glass-effect" id="animeDetails">

                    <div class="spinner"></div>
